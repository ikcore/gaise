# Amazon Bedrock: representative current and lifecycle-sensitive families
# IDs are region-specific. Callers usually invoke cross-region inference
# profiles (us., eu., apac., jp., au., global. prefixes); the registry matcher
# strips those prefixes and Bedrock `-vN:M` suffixes. ListFoundationModels
# reports TEXT/IMAGE/EMBEDDING modalities and streaming only; document, tool,
# and reasoning support below comes from the per-model cards.

