# Amazon Bedrock: representative current and lifecycle-sensitive families
# IDs are region-specific. Callers usually invoke cross-region inference
# profiles (us., eu., apac., jp., au., in., global., us-gov. prefixes); the
# registry matcher strips those prefixes and Bedrock `-vN:M` suffixes.
# ListFoundationModels reports TEXT/IMAGE/EMBEDDING modalities and streaming
# only; document, tool, and reasoning support below comes from the per-model
# cards. Effort ladders on Claude entries follow the direct Claude API docs;
# AWS's adaptive-thinking page tabulates xhigh/max more narrowly.

[[models]]
provider = "bedrock"
model = "anthropic.claude-fable-5-1"
status = "active"
capabilities = ["text", "image_input", "files", "adaptive_reasoning", "streaming", "tools"]
reasoning_values = ["low", "medium", "high", "xhigh", "max"]
context_window = 1000000
max_output_tokens = 128000
gaise_support = "native via Converse"
notes = "Launched 2026-09-01. Profiles us. and global. only (no in-region id on bedrock-runtime); us. includes GovCloud. Adaptive thinking always on; effort low..max, default high. temperature must be 1.0 or unset, top_p 0.99 or unset, never both, top_k unsupported. Converse toolChoice tool/any return 400 (GAISe never sends toolChoice). Requires the aws_review data-retention mode. Prompt cache minimum 512 tokens, 1h TTL. Higher refusal rates: check stop_reason refusal and stop_details."

