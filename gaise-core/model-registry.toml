model = "gpt-5.6"
aliases = ["gpt-5.6-sol"]
status = "active"
capabilities = ["text", "image_input", "reasoning", "streaming", "tools"]
reasoning_values = ["none", "low", "medium", "high", "xhigh", "max"]
context_window = 1050000
max_output_tokens = 128000
gaise_support = "chat-compatible features"
notes = "OpenAI documents gpt-5.6-sol as the snapshot ID and gpt-5.6 as the alias that routes to it. On Chat Completions, function tools require reasoning_effort='none'; the adapter applies this automatically (observed API behaviour, not documented). Responses is recommended for reasoning with tools, persisted reasoning (GPT-5.6 defaults to reasoning.context all_turns there), pro mode, programmatic tools, and multi-agent. Accepts image detail 'original'. Promotional pricing ($4/$20 per 1M) through 2026-11-21."

