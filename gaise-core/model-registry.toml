# Gemini API (Google AI)
# Text models accept text, image, video, audio, and PDF input. Thinking
# levels per family: 3.x uses thinkingLevel (3.7 and 3.8 Flash and the Pro
# models reject minimal); 2.5 keeps thinkingBudget (numeric ranges are now
# published only on Vertex: Flash 1-24,576, Pro 128-32,768, Flash-Lite
# 512-24,576, 0 disables except Pro, -1 dynamic). Sampling parameters are
# deprecated on every 3.x model and omitted by the mapper.

