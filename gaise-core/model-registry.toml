# GAISe model compatibility and lifecycle registry
# Audited against official provider documentation on 2026-09-04 (previous
# audits 2026-07-22, 2026-08-20). Context windows, output ceilings, and
# character budgets (`context_window`, `max_output_tokens`,
# `max_input_characters`) were re-verified against the vendor model pages on
# 2026-09-04; embedding per-text limits live in
# `[models.embedding] max_input_tokens`.
#
# This registry is advisory. GAISe deliberately accepts arbitrary model IDs, so
# newly released models can work before this file is updated. Provider model
# catalogs, regional availability, account access, and API surfaces remain the
# final authority.

schema_version = 2
audited_on = "2026-09-04"

# Capability vocabulary (closed; parsed by gaise_core::registry):
#   input modalities : text, image_input, audio_input, video_input, files
#   output modalities: text, image_output, audio_output, embeddings
#   operations       : embeddings -> Embeddings, realtime -> Live,
#                      text (+streaming) -> Instruct (+InstructStream)
#   features         : tools, reasoning, adaptive_reasoning, manual_reasoning,
#                      image_editing, multimodal_embeddings
# `operations = [...]` overrides the derived operations; `operations = []`
# marks a model GAISe can describe but not drive (Responses-only, TTS, Live
# where the provider crate has no live transport).
# Entries may use `*` wildcards for dynamic families; dated snapshots and
# Bedrock `-vN:M` suffixes match their base entry automatically.

[[providers]]
key = "openai"
gaise_surface = "Chat Completions, Embeddings, and Realtime"
catalog = "https://developers.openai.com/api/docs/models"
lifecycle = "https://developers.openai.com/api/docs/deprecations"
discovery = "GET /v1/models (id, created, owned_by, shutdown_date only)"
notes = "The current instruct client uses Chat Completions. Responses-only features and the Images API are outside that client. Chat Completions contract as of 2026-09-04: reasoning_effort accepts none, minimal, low, medium, high, xhigh, max (per-model subsets); service_tier accepts fast (Priority processing was renamed Fast mode on 2026-07-30; priority is still accepted); prompt_cache_retention is deprecated in favour of prompt_cache_options.ttl; the Assistants API shut down 2026-08-26."

[[providers]]
key = "anthropic"
gaise_surface = "Messages"
catalog = "https://platform.claude.com/docs/en/about-claude/models/overview"
lifecycle = "https://platform.claude.com/docs/en/about-claude/model-deprecations"
discovery = "GET /v1/models (capabilities: image_input, pdf_input, thinking types, effort levels, structured_outputs, token limits)"
notes = "Direct Claude API lifecycle. Bedrock-hosted Claude has a separate AWS lifecycle. Anthropic labels every 4.x model except Haiku 4.5, plus Fable 5, as Legacy (still served, no retirement date) since the 2026-09-01 Fable 5.1 release; the registry mirrors that as status legacy. Messages contract as of 2026-09-04: temperature/top_p/top_k are deprecated and rejected at non-default values on Opus 4.7 and later; output_format is deprecated in favour of output_config.format; stop_reason may be refusal (with stop_details) on Fable/Opus 5 models and model_context_window_exceeded; the Files API and Skills API are out of beta (no header); thinking.display accepts updates behind the thinking-display-updates-2026-08-18 beta."

[[providers]]
key = "gemini"
gaise_surface = "Gemini generateContent, streamGenerateContent, Embeddings, and Live"
catalog = "https://ai.google.dev/gemini-api/docs/models"
lifecycle = "https://ai.google.dev/gemini-api/docs/deprecations"
discovery = "GET /v1beta/models (supportedGenerationMethods, token limits, thinking flag; no modalities)"
notes = "Google AI Gemini API lifecycle; do not reuse these dates for Vertex AI. Shutdown dates on the deprecations page are the earliest possible retirement dates. generateContent contract as of 2026-09-04: temperature/top_p/top_k are deprecated on every Gemini 3.x (the adapter omits them) and candidateCount is unsupported there; generationConfig gained responseFormat, enableAffectiveDialog, translationConfig, and audioTranscriptionConfig while responseSchema is deprecated in favour of responseJsonSchema; Part.mediaProcessing (STATIC | AGENTIC) selects agentic video understanding on 3.5 Flash-Lite, 3.6, 3.7, and 3.8; embedContent's top-level taskType/title/outputDimensionality are deprecated in favour of embedContentConfig (the adapter still sends the accepted top-level form). The thinking guide is now written against the Interactions API and lists the 2.5 family under thinking_level, but the REST reference and Vertex state that thinkingLevel errors on pre-3 models, so the adapter keeps thinkingBudget for 2.5."

[[providers]]
key = "vertexai"
gaise_surface = "Vertex AI generateContent, streamGenerateContent, and Embeddings"
catalog = "https://docs.cloud.google.com/vertex-ai/generative-ai/docs/learn/models"
lifecycle = "https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/model-versions"
discovery = "GET {region}-aiplatform.googleapis.com/v1beta1/publishers/{publisher}/models (names, versionId, launchStage; no modalities or limits)"
notes = "Model availability and retirement dates are specific to Google Cloud. Short-term availability models retire 45 days after a replacement is released. Release notes moved to https://docs.cloud.google.com/gemini-enterprise-agent-platform/release-notes (the Vertex AI release-notes page is frozen at 2026-05-26). On 3.6+ Flash, 3.5 Flash-Lite, 3.7, and 3.8, custom temperature/topP/topK are ignored, frequency/presence penalties and candidateCount raise errors, and a trailing model turn is rejected; thinking_level on a pre-Gemini-3 model errors, and mixing thinking_level with thinking_budget on Gemini 3 errors. Claude on Vertex uses suffix-less ids (claude-fable-5-1, claude-opus-5, claude-sonnet-5, ...) through the Anthropic rawPredict Messages shape, which the Gemini-shaped Vertex adapter does not produce."

[[providers]]
key = "bedrock"
gaise_surface = "Converse, ConverseStream, and InvokeModel"
catalog = "https://docs.aws.amazon.com/bedrock/latest/userguide/model-cards.html"
lifecycle = "https://docs.aws.amazon.com/bedrock/latest/userguide/model-lifecycle.html"
discovery = "ListFoundationModels, GetFoundationModel, and ListInferenceProfiles"
notes = "Model IDs, inference profiles, lifecycle, and availability vary by AWS region. AWS replaced the Converse feature matrix with per-model cards (model-card-*.html) and models-api-compatibility.html in mid-2026; models-supported.html and inference-profiles-support.html now redirect to them. Since 2026-08-15 AWS recommends the bedrock-runtime endpoint for new applications (bedrock-mantle keeps server-side tools, async inference, and some gated models). Cross-region profile prefixes seen on cards: us., eu., apac., jp., au., in. (India, 2026-08-18), global., us-gov.; the registry matcher strips all of them. Converse contract as of 2026-09-04: serviceTier priority/default/flex/reserved; outputConfig.textFormat for structured outputs; cachePoint.ttl 5m/1h; audio and searchResult content blocks; stopReason adds malformed_model_output, malformed_tool_use, model_context_window_exceeded."

[[providers]]
key = "elevenlabs"
gaise_surface = "Text-to-speech, streaming speech, realtime voice WebSocket, and model listing"
catalog = "https://elevenlabs.io/docs/overview/models"
lifecycle = "https://elevenlabs.io/docs/overview/models"
discovery = "GET /v1/models (model_id, languages, can_do_text_to_speech, can_use_style, character limits); GET /v2/voices for voices"
notes = "Voices are account-specific and default voices expire 2026-12-31; never hard-code a voice id. Character limits per request are model-specific; the character-cost header reports billing."

[[providers]]
key = "ollama"
gaise_surface = "Chat, streaming chat, and Embeddings"
catalog = "https://ollama.com/search"
lifecycle = "dynamic local catalog"
discovery = "GET /api/tags"
notes = "Tags are installed locally and can move; Ollama has no centralized retirement calendar. Cloud-hosted tags (`family:size-cloud`, run through ollama.com with an API key) match the same family globs. API as of Ollama v0.33.3 (2026-09-02): `think` accepts true/false or the strings low, medium, high, max (any other string is rejected; GPT-OSS takes levels only); chat and generate responses report prompt_eval_cached_count; requests accept logprobs/top_logprobs; /api/show capabilities may include image and audio; the default repeat_penalty became 1.0 in v0.32.10."

# OpenAI: current families

[[models]]
provider = "openai"
model = "gpt-6-astra"
status = "limited_availability"
capabilities = ["text", "image_input", "reasoning", "streaming"]
reasoning_values = ["low", "medium", "high", "xhigh", "max"]
context_window = 1050000
max_output_tokens = 128000
gaise_support = "chat-compatible features without function tools"
notes = "Released 2026-09-03 for Trusted Access Program enterprises first; broader availability announced as following. Knowledge cutoff 2026-04-30. Chat Completions is supported, but tool calling requires the Responses API (the instruct client fails fast when tools are present), reasoning_effort none and minimal return 400 (the adapter clamps them to low), and temperature, top_p, logprobs, and top_logprobs are rejected (the adapter never sends sampling). No dated snapshot or gpt-6 alias is documented. Input above 272K tokens is billed at long-context rates."

[[models]]
